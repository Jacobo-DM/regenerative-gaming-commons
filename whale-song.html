<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whale Song</title>
  <style>
    :root {
      --bg: #0b1020;
      --text: #e8eef7;
      --soft: rgba(232, 238, 247, 0.72);
      --line: rgba(232, 238, 247, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(60, 90, 150, 0.18), transparent 35%),
        linear-gradient(180deg, #09101d 0%, #0b1020 45%, #050811 100%);
      color: var(--text);
      font-family: Georgia, serif;
      line-height: 1.6;
      padding: 24px;
    }

    .shell {
      width: 100%;
      max-width: 700px;
      padding: 40px 24px 48px;
      text-align: center;
      border: 1px solid var(--line);
      background: rgba(6, 10, 20, 0.55);
      backdrop-filter: blur(2px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: normal;
      letter-spacing: 0.02em;
    }

    .soft {
      color: var(--soft);
    }

    .spacer {
      height: 28px;
    }

    .rule {
      width: 72px;
      height: 1px;
      background: var(--line);
      margin: 28px auto;
    }

    audio {
      width: 100%;
      max-width: 460px;
      margin: 18px auto 8px;
      display: block;
      filter: saturate(0.85) brightness(0.95);
    }

    .note {
      font-size: 0.95rem;
      color: var(--soft);
      max-width: 34rem;
      margin: 10px auto 0;
    }

    .return {
      display: inline-block;
      margin-top: 30px;
      color: var(--soft);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 3px;
    }

    .return:hover,
    .return:focus {
      color: var(--text);
      border-bottom-color: var(--text);
    }
  </style>
</head>
<body>
  <main class="shell">
    <h1>🐋 Whale Song</h1>
    <p class="soft">Begin with sound.</p>

    <audio controls preload="none">
      <source src="assets/audio/whale-song.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>

    <p class="note">
      If there is no sound yet, the song has not been placed in the commons.
    </p>

    <div class="rule"></div>

    <p>Listen.</p>
    <p class="soft">Make a sound, if you like.</p>
    <p class="soft">Or don’t.</p>

    <div class="spacer"></div>

    <p>There is no right sound.</p>
    <p>There is no wrong silence.</p>

    <div class="rule"></div>

    <p class="soft">If something shifts, notice that.</p>
    <p class="soft">If nothing shifts, that is fine too.</p>

    <a class="return" href="index.html">Return</a>
  </main>
</body>
</html>
